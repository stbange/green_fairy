<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" href="data:," />
  <title>Green Fairy — 3D Modular Synth Sanctum</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; background: #050d0f; color: #72f7a8; font-family: monospace; overscroll-behavior: none; }
    #canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; outline: none; }
    #gf-overlay-bar {
      position: fixed; top: 46px; left: 10px; z-index: 20;
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
      background: rgba(5, 16, 20, 0.88); border: 1px solid #2ed97a; padding: 4px 8px;
      font-size: 11px; border-radius: 3px;
    }
    body.gf-touch-mode #gf-overlay-bar {
      bottom: auto; top: 126px; left: 10px; right: 10px;
      flex-wrap: nowrap; gap: 4px; padding: 3px 6px; font-size: 10px;
    }
    body.gf-touch-mode #gf-mode-badge { display: none; }
    body.gf-touch-mode .gf-desktop-only { display: none; }
    body.gf-touch-mode .gf-select { flex: 1 1 0; min-width: 0; max-width: none; padding: 3px 4px; font-size: 10px; }
    body.gf-touch-mode .gf-btn { padding: 3px 5px; font-size: 10px; white-space: nowrap; }
    body.gf-touch-mode #gf-xr-btn:disabled { display: none; }
    .gf-btn, .gf-select {
      background: #0b2622; color: #8dffbe; border: 1px solid #35e585;
      padding: 4px 7px; cursor: pointer; font-family: monospace; font-size: 11px;
    }
    .gf-btn.gf-rec-active { background: #6b1616; border-color: #ff6b6b; color: #ffd6d6; }
    .gf-btn.gf-loop-active { background: #145c3e; border-color: #6bffb8; color: #ffffff; }
    .gf-select { max-width: 195px; }
    .gf-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    #gf-loading {
      position: fixed; inset: 0; display: flex; flex-direction: column; gap: 8px;
      align-items: center; justify-content: center; background: #050d0f; z-index: 30;
    }
  </style>
</head>
<body>
  <div id="gf-loading">
    <h2>GREEN FAIRY SANCTUM</h2>
    <p id="gf-status-msg">Hydrating external 3D sanctum &amp; DSP assets...</p>
  </div>
  <div id="gf-overlay-bar">
    <span id="gf-mode-badge">MODE: DESKTOP</span>
    <select id="gf-preset-select" class="gf-select" title="320+ Fantasy &amp; Space Presets"></select>
    <button id="gf-mutate-btn" class="gf-btn" title="Breed Sound Mutation">MUTATE</button>
    <select id="gf-melody-select" class="gf-select" title="108 Slow Ambient Cinematic Hans Zimmer Melodies"></select>
    <button id="gf-rec-btn" class="gf-btn gf-desktop-only" title="Record / Loop Short Note Sequence (Key: L)">REC</button>
    <button id="gf-loop-btn" class="gf-btn gf-desktop-only" title="Play / Stop Loop or Melody (Key: Space)">LOOP</button>
    <button id="gf-audio-btn" class="gf-btn">AUDIO</button>
    <button id="gf-xr-btn" class="gf-btn" disabled>WEBXR N/A</button>
  </div>
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  <script src="js/webxr.js"></script>
  <script src="js/bridge.js"></script>
  {{{ SCRIPT }}}
</body>
</html>
